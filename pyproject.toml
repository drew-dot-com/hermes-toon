[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "hermes-toon"
version = "0.1.2"
description = "Hermes Agent web-extract provider that pays a TOON node per fetch: pages fetched through Anyone network exits, returned as markdown with a reproducible content hash"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [{ name = "Drew Pierson" }]
dependencies = [
    "httpx>=0.27,<0.29",
]

[project.urls]
Repository = "https://github.com/drew-dot-com/hermes-toon"
Node = "https://github.com/drew-dot-com/anonfetch"

[project.entry-points."hermes_agent.plugins"]
toon = "hermes_toon"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_toon"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
